# fullsend-stage: minimal-explore
name: Minimal Explore
run-name: 'minimal-explore · ${{ inputs.source_repo }}#${{ inputs.issue_number }}'

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Owner/repo to explore (must be enrolled, e.g. ascerra-fullsend-rehearsal/fullsend)"
        required: true
        type: string
        default: "ascerra-fullsend-rehearsal/fullsend"
      issue_number:
        description: "GitHub issue number to explore"
        required: true
        type: string
      dry_run:
        description: "Skip posting the issue comment (still runs the agent)"
        required: false
        type: choice
        options:
          - "false"
          - "true"
        default: "false"

concurrency:
  group: fullsend-minimal-explore-${{ inputs.source_repo }}-${{ inputs.issue_number }}
  cancel-in-progress: true

jobs:
  minimal-explore:
    name: Minimal Explore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
      id-token: write
      issues: write

    steps:
      - name: Checkout .fullsend repository
        uses: actions/checkout@v6

      - name: Checkout upstream defaults
        uses: actions/checkout@v6
        with:
          repository: fullsend-ai/fullsend
          ref: v0
          path: .defaults
          sparse-checkout: |
            internal/scaffold/fullsend-repo/

      - name: Prepare workspace (upstream defaults + org overrides)
        run: |
          set -euo pipefail
          SRC=".defaults/internal/scaffold/fullsend-repo"
          LAYERED_DIRS="agents skills schemas harness plugins policies scripts env"
          for dir in ${LAYERED_DIRS}; do
            if [[ -d "${SRC}/${dir}" ]]; then
              mkdir -p "${dir}"
              cp -r "${SRC}/${dir}/." "${dir}/"
            fi
          done
          for dir in ${LAYERED_DIRS}; do
            if [[ -d "customized/${dir}" ]]; then
              find "customized/${dir}" -type f ! -name '.gitkeep' -print0 \
                | while IFS= read -r -d '' f; do
                    rel="${f#customized/}"
                    mkdir -p "$(dirname "${rel}")"
                    cp "${f}" "${rel}"
                  done
            fi
          done
          mkdir -p .github/scripts
          cp "${SRC}/.github/scripts/setup-agent-env.sh" .github/scripts/setup-agent-env.sh
          rm -rf .defaults
          echo "Harness files:"
          ls -la harness/ || true

      - name: Validate enrollment and extract repo metadata
        id: repo-parts
        uses: fullsend-ai/fullsend/.github/actions/validate-enrollment@v0
        with:
          source_repo: ${{ inputs.source_repo }}

      - name: Validate issue number
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          if [[ ! "${ISSUE_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::error::issue_number must be a positive integer"
            exit 1
          fi

      - name: Mint triage token
        id: app-token
        uses: fullsend-ai/fullsend/.github/actions/mint-token@v0
        with:
          role: triage
          repos: ${{ steps.repo-parts.outputs.name }}
          mint_url: ${{ vars.FULLSEND_MINT_URL }}

      - name: Setup GCP and prepare credentials
        uses: fullsend-ai/fullsend/.github/actions/setup-gcp@v0
        with:
          gcp_wif_provider: ${{ secrets.FULLSEND_GCP_WIF_PROVIDER }}
          gcp_project_id: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}

      - name: Setup agent environment
        env:
          AGENT_PREFIX: MINIMAL_EXPLORE_
          MINIMAL_EXPLORE_GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MINIMAL_EXPLORE_SOURCE_REPO: ${{ inputs.source_repo }}
          MINIMAL_EXPLORE_ISSUE_NUMBER: ${{ inputs.issue_number }}
          MINIMAL_EXPLORE_DRY_RUN: ${{ inputs.dry_run }}
          MINIMAL_EXPLORE_ANTHROPIC_VERTEX_PROJECT_ID: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
          MINIMAL_EXPLORE_CLOUD_ML_REGION: ${{ vars.FULLSEND_GCP_REGION }}
        run: bash .github/scripts/setup-agent-env.sh

      - name: Create empty target-repo directory
        run: mkdir -p target-repo

      - name: Run minimal-explore agent
        uses: fullsend-ai/fullsend@v0
        with:
          agent: minimal-explore
          github_token: ${{ steps.app-token.outputs.token }}
