# fullsend organization configuration
# https://github.com/fullsend-ai/fullsend
#
# This file is managed by fullsend. Manual edits may be overwritten.
version: "1"
dispatch:
    platform: github-actions
    mode: oidc-mint
inference:
    provider: vertex
defaults:
    roles:
        - fullsend
        - triage
        - coder
        - fix
        - review
        - retro
        - prioritize
    max_implementation_retries: 2
    auto_merge: false
repos:
    .fullsend:
        enabled: false
    fullsend:
        enabled: true
agents:
    # Lightweight explore agent for rehearsal testing (local customized/ overlay).
    # Workflow: .github/workflows/minimal-explore.yml
    - source: harness/minimal-explore.yaml
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
